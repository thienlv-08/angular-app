<mat-sidenav-container class="shell">
  <mat-sidenav
    mode="side"
    opened
    class="sidenav"
    [class.sidenav-collapsed]="!sidenavExpanded()"
  >
    <mat-toolbar color="primary" class="brand-toolbar">
      <span class="brand-mark" aria-hidden="true">CF</span>
      @if (sidenavExpanded()) {
        <div class="brand-text">
          <span class="brand-title">Cash Flow</span>
          <span class="brand-subtitle">Quản lý dòng tiền</span>
        </div>
      }
      <span class="brand-toolbar-spacer"></span>
      <button
        mat-icon-button
        type="button"
        class="sidenav-toggle"
        (click)="toggleSidenav()"
        [attr.aria-label]="sidenavExpanded() ? 'Thu gọn menu' : 'Mở rộng menu'"
        [attr.aria-expanded]="sidenavExpanded()"
      >
        <mat-icon>{{ sidenavExpanded() ? 'chevron_left' : 'chevron_right' }}</mat-icon>
      </button>
    </mat-toolbar>

    <nav aria-label="Điều hướng chính">
      @for (group of navGroups; track group.label) {
        <div class="nav-group">
          @if (sidenavExpanded()) {
            <div mat-subheader>{{ group.label }}</div>
          }
          <mat-nav-list>
            @for (item of group.items; track item.path) {
              <a
                mat-list-item
                [routerLink]="item.path"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
                [attr.aria-label]="item.label"
                [matTooltip]="item.label"
                [matTooltipDisabled]="sidenavExpanded()"
                matTooltipPosition="right"
              >
                <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
                @if (sidenavExpanded()) {
                  <span matListItemTitle>{{ item.label }}</span>
                }
              </a>
            }
          </mat-nav-list>
        </div>
      }
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      <button
        mat-icon-button
        type="button"
        (click)="toggleSidenav()"
        [attr.aria-label]="sidenavExpanded() ? 'Thu gọn menu' : 'Mở rộng menu'"
        [attr.aria-expanded]="sidenavExpanded()"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <span>Quản lý dòng tiền doanh nghiệp</span>
    </mat-toolbar>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
